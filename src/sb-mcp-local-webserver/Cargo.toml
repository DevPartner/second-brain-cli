[package]
name = "sb-mcp-server"
version = "0.1.0"
edition = "2021"
description = "Simple HTTP adapter exposing sb util (Second Brain) search as MCP-compatible endpoints"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dotenvy = "0.15"
rmcp = { version = "3.1.2", features = ["server", "macros", "schemars", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
schemars = "1"
